services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: "redis://redis:6379"
      RATE_LIMIT_CAPACITY: "100000"
      RATE_LIMIT_REFILL: "50000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["arq", "worker.worker.WorkerSettings"]
    environment:
      REDIS_URL: "redis://redis:6379"
      JOB_MAX_TRIES: "3"
      JOB_BACKOFF_BASE: "1.0"
    depends_on:
      redis:
        condition: service_healthy